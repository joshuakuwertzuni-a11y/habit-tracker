<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4a9e6b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Habits">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon192.png">
  <title>Habit Tracker</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app">

    <header>
      <div class="header-top">
        <h1>Habits</h1>
        <span class="date" id="today-date"></span>
      </div>
      <nav class="tabs">
        <button class="tab active" data-tab="today">Heute</button>
        <button class="tab" data-tab="stats">Statistiken</button>
      </nav>
    </header>

    <!-- TODAY -->
    <main id="view-today">
      <div class="progress-wrap">
        <div class="progress-bar-track">
          <div class="progress-bar" id="progress-bar"></div>
        </div>
        <span class="progress-label" id="progress-label">0 / 0 erledigt</span>
      </div>

      <ul class="habit-list" id="habit-list"></ul>

      <div class="empty-state hidden" id="empty-state">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
          <path d="M9 12l2 2 4-4"/><rect x="3" y="4" width="18" height="18" rx="2"/>
        </svg>
        <p>Noch keine Habits.<br>Füge deinen ersten unten hinzu!</p>
      </div>
    </main>

    <!-- STATS -->
    <main id="view-stats" class="hidden">
      <div class="stats-summary" id="stats-summary"></div>
      <div class="stat-cards" id="stat-cards"></div>
      <div class="empty-state hidden" id="stats-empty">
        <p>Noch keine Daten vorhanden.</p>
      </div>
    </main>

    <!-- ADD BAR (fixed bottom) -->
    <form class="add-bar" id="add-form">
      <input type="text" id="habit-input" placeholder="Neuen Habit hinzufügen…" maxlength="40" autocomplete="off" enterkeyhint="done">
      <button type="submit" aria-label="Hinzufügen">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M12 5v14M5 12h14"/>
        </svg>
      </button>
    </form>

  </div>
  <script src="app.js"></script>
</body>
</html>
